art"><tspan x="1315" y="181.0">02   PHYSICAL HARDWARE</tspan></text><rect x="40" y="840" width="1200" height="280" rx="15" fill="#f6f1fb" stroke="#b7a2d1" stroke-width="2" stroke-dasharray="9 7"/><text x="65" y="881" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7755a2" text-anchor="start"><tspan x="65" y="881.0">03   SIMULATION &amp; TEST ADAPTERS</tspan></text><text x="80" y="915" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#596c76" text-anchor="start"><tspan x="80" y="915.0">Replaces camera / motor hardware; the runtime, learner and dashboard stay the same.</tspan></text><polyline points="365,275 435,275" fill="none" stroke="#2b6eab" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-2b6eab)" marker-start="url(#arrow-2b6eab-start)"/><text x="371" y="261" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2b6eab" text-anchor="start"><tspan x="371" y="261.0">HTTP</tspan></text><polyline points="905,275 795,275" fill="none" stroke="#2b6eab" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-2b6eab)"/><text x="824" y="263" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2b6eab" text-anchor="start"><tspan x="824" y="263.0">pose</tspan></text><polyline points="1315,275 1205,275" fill="none" stroke="#2b6eab" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-2b6eab)"/><text x="1214" y="255" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2b6eab" text-anchor="start"><tspan x="1214" y="255.0">USB RGB</tspan></text><polyline points="615,355 615,455" fill="none" stroke="#2b6eab" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-2b6eab)" marker-start="url(#arrow-2b6eab-start)"/><text x="633" y="393" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2b6eab" text-anchor="start"><tspan x="633" y="393.0">observed trials /</tspan><tspan x="633" y="415.5">learned predictions</tspan></text><polyline points="795,320 855,320 855,420 1055,420 1055,455" fill="none" stroke="#2b6eab" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-2b6eab)"/><text x="864" y="410" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2b6eab" text-anchor="start"><tspan x="864" y="410.0">abstract commands</tspan></text><polyline points="435,305 400,305 400,530 365,530" fill="none" stroke="#596c76" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-596c76)"/><text x="365" y="387" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#596c76" text-anchor="start"><tspan x="365" y="387.0">logs</tspan></text><polyline points="220,605 220,645" fill="none" stroke="#596c76" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-596c76)"/><polyline points="1205,520 1315,520" fill="none" stroke="#2b6eab" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-2b6eab)" marker-start="url(#arrow-2b6eab-start)"/><text x="1209" y="463" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2b6eab" text-anchor="start"><tspan x="1209" y="463.0">USB serial</tspan><tspan x="1209" y="483.0">115200 baud</tspan></text><text x="1213" y="555" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2b6eab" text-anchor="start"><tspan x="1213" y="555.0">ACK / STOP</tspan></text><polyline points="1495,575 1495,660" fill="none" stroke="#a76824" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-a76824)"/><text x="1515" y="603" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#a76824" text-anchor="start"><tspan x="1515" y="603.0">PWM + direction</tspan><tspan x="1515" y="624.25">+ STBY</tspan></text><polyline points="1495,775 1495,845" fill="none" stroke="#a76824" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-a76824)"/><text x="1520" y="809" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a76824" text-anchor="start"><tspan x="1520" y="809.0">motor outputs A / B</tspan></text><polyline points="1675,910 1725,910 1725,275 1675,275" fill="none" stroke="#22775a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-22775a)" stroke-dasharray="8 6"/><text x="1455" y="374" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#22775a" text-anchor="start"><tspan x="1455" y="374.0">Top marker → camera</tspan><tspan x="1455" y="397.75">visual feedback</tspan></text><polyline points="1320,1050 1307,1050 1307,718 1315,718" fill="none" stroke="#a76824" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-a76824)"/><polyline points="405,995 465,995" fill="none" stroke="#7755a2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-7755a2)"/><text x="403" y="981" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7755a2" text-anchor="start"><tspan x="403" y="981.0">render</tspan></text><polyline points="640,835 640,795" fill="none" stroke="#7755a2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-7755a2)" stroke-dasharray="8 6"/><text x="658" y="821" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#7755a2" text-anchor="start"><tspan x="658" y="821.0">same interfaces</tspan></text><rect x="80" y="215" width="280" height="120" rx="15" fill="#ffffff" stroke="#2b6eab" stroke-width="2"/><text x="98" y="254" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2b6eab" text-anchor="start"><tspan x="98" y="254.0">Operator dashboard</tspan></text><text x="98" y="287" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="98" y="287.0">Browser: localhost:8770</tspan><tspan x="98" y="309.5">Buttons, target, camera, metrics</tspan></text><rect x="440" y="205" width="350" height="145" rx="15" fill="#dcebf8" stroke="#2b6eab" stroke-width="2"/><text x="458" y="244" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2b6eab" text-anchor="start"><tspan x="458" y="244.0">Runtime + safety</tspan></text><text x="458" y="277" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="458" y="277.0">Owns every motor permission</tspan><tspan x="458" y="299.5">Jobs, freshness, lease, boundaries</tspan><tspan x="458" y="322.0">STOP cancels pending actions</tspan></text><rect x="910" y="215" width="290" height="120" rx="15" fill="#ffffff" stroke="#2b6eab" stroke-width="2"/><text x="928" y="254" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2b6eab" text-anchor="start"><tspan x="928" y="254.0">Vision pipeline</tspan></text><text x="928" y="287" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="928" y="287.0">Camera adapter + calibration</tspan><tspan x="928" y="309.5">ArUco detection → x, y, heading</tspan></text><rect x="440" y="460" width="350" height="140" rx="15" fill="#e6f4ec" stroke="#22775a" stroke-width="2"/><text x="458" y="499" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#22775a" text-anchor="start"><tspan x="458" y="499.0">Learning + navigation</tspan></text><text x="458" y="532" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="458" y="532.0">CPU regression + target policy</tspan><tspan x="458" y="554.5">Learns from observed movement</tspan><tspan x="458" y="577.0">Never sees the hidden motor map</tspan></text><rect x="910" y="460" width="290" height="140" rx="15" fill="#fff0dd" stroke="#a76824" stroke-width="2"/><text x="928" y="499" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a76824" text-anchor="start"><tspan x="928" y="499.0">Private actuator</tspan></text><text x="928" y="532" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="928" y="532.0">Hidden command remapping</tspan><tspan x="928" y="554.5">Bounded pulses + serial adapter</tspan><tspan x="928" y="577.0">Motor outputs stay private</tspan></text><rect x="80" y="460" width="280" height="140" rx="15" fill="#ffffff" stroke="#596c76" stroke-width="2"/><text x="98" y="499" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#596c76" text-anchor="start"><tspan x="98" y="499.0">Local run storage</tspan></text><text x="98" y="532" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="98" y="532.0">Append-only observations / logs</tspan><tspan x="98" y="554.5">Config, calibration, checkpoints</tspan><tspan x="98" y="577.0">Separate actuator audit file</tspan></text><rect x="80" y="650" width="280" height="100" rx="15" fill="#ffffff" stroke="#596c76" stroke-width="2"/><text x="98" y="689" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#596c76" text-anchor="start"><tspan x="98" y="689.0">Replay / export</tspan></text><text x="98" y="722" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="98" y="722.0">Read-only view; no motor link</tspan></text><rect x="440" y="650" width="760" height="100" rx="15" fill="#ffffff" stroke="#94b4d1" stroke-width="2"/><text x="460" y="684" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2b6eab" text-anchor="start"><tspan x="460" y="684.0">Hardware starts disarmed. A connection never starts motion.</tspan></text><text x="460" y="720" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#596c76" text-anchor="start"><tspan x="460" y="720.0">Missing tracking, ACKs or operator lease → outputs stop.</tspan><tspan x="460" y="742.5">No cloud service, GPU server or external database is required.</tspan></text><rect x="1320" y="215" width="350" height="110" rx="15" fill="#ffffff" stroke="#a76824" stroke-width="2"/><text x="1338" y="254" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a76824" text-anchor="start"><tspan x="1338" y="254.0">Overhead camera</tspan></text><text x="1338" y="287" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="1338" y="287.0">OAK-1 via DepthAI (or webcam)</tspan><tspan x="1338" y="309.5">Fixed mount; USB power + video</tspan></text><rect x="1320" y="440" width="350" height="130" rx="15" fill="#fff0dd" stroke="#a76824" stroke-width="2"/><text x="1338" y="479" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a76824" text-anchor="start"><tspan x="1338" y="479.0">Uno / RedBoard</tspan></text><text x="1338" y="512" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="1338" y="512.0">Watchdog motor firmware</tspan><tspan x="1338" y="534.5">USB logic power from Mac</tspan><tspan x="1338" y="557.0">Boot / STOP / timeout: disarmed</tspan></text><rect x="1320" y="665" width="350" height="110" rx="15" fill="#ffffff" stroke="#a76824" stroke-width="2"/><text x="1338" y="704" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a76824" text-anchor="start"><tspan x="1338" y="704.0">TB6612FNG driver</tspan></text><text x="1338" y="737" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="1338" y="737.0">Logic signals → motor power</tspan><tspan x="1338" y="759.5">VCC: controller 5 V; VM: battery</tspan></text><rect x="1320" y="850" width="350" height="130" rx="15" fill="#ffffff" stroke="#a76824" stroke-width="2"/><text x="1338" y="889" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a76824" text-anchor="start"><tspan x="1338" y="889.0">Robot chassis</tspan></text><text x="1338" y="922" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="1338" y="922.0">Two motors + wheels</tspan><tspan x="1338" y="944.5">Rigid top-mounted ArUco marker</tspan><tspan x="1338" y="967.0">Physical motion closes the loop</tspan></text><rect x="1320" y="1010" width="350" height="85" rx="15" fill="#fff0dd" stroke="#a76824" stroke-width="2"/><text x="1338" y="1049" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a76824" text-anchor="start"><tspan x="1338" y="1049.0">Separate motor battery</tspan></text><text x="1338" y="1082" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="1338" y="1082.0">Common ground with controller</tspan></text><rect x="80" y="930" width="320" height="145" rx="15" fill="#ffffff" stroke="#7755a2" stroke-width="2"/><text x="98" y="969" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7755a2" text-anchor="start"><tspan x="98" y="969.0">Hidden-map simulator</tspan></text><text x="98" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="98" y="1002.0">Differential-drive physics</tspan><tspan x="98" y="1024.5">Seeded noise, lag and faults</tspan><tspan x="98" y="1047.0">Commands drive actual simulation</tspan></text><rect x="470" y="930" width="320" height="145" rx="15" fill="#ffffff" stroke="#7755a2" stroke-width="2"/><text x="488" y="969" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7755a2" text-anchor="start"><tspan x="488" y="969.0">Generated camera frames</tspan></text><text x="488" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="488" y="1002.0">Rendered marker → real tracker</tspan><tspan x="488" y="1024.5">Optional noisy-pose mode</tspan><tspan x="488" y="1047.0">Plant truth is not a learner input</tspan></text><rect x="860" y="930" width="340" height="145" rx="15" fill="#ffffff" stroke="#7755a2" stroke-width="2"/><text x="878" y="969" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7755a2" text-anchor="start"><tspan x="878" y="969.0">Fake firmware / PTY</tspan></text><text x="878" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#233540" text-anchor="start"><tspan x="878" y="1002.0">Tests the real serial adapter</tspan><tspan x="878" y="1024.5">ACK, watchdog, reset, disconnect</tspan><tspan x="878" y="1047.0">No physical device needed</tspan></text><text x="40" y="1168" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#22775a" text-anchor="start"><tspan x="40" y="1168.0">VERIFIED IN SOFTWARE</tspan></text><text x="350" y="1169" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#233540" text-anchor="start"><tspan x="350" y="1169.0">Simulation • generated-frame tracking • UI • logging / replay • fake serial • Uno build</tspan></text><text x="40" y="1208" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#a76824" text-anchor="start"><tspan x="40" y="1208.0">PHYSICAL CHECKS NEXT</tspan></text><text x="350" y="1209" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#233540" text-anchor="start"><tspan x="350" y="1209.0">Wiring + raised wheels • real camera calibration / timing • real training and navigation trials</tspan></text></svg>