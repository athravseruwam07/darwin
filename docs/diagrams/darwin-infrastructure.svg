<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240"><title>Darwin infrastructure and data flow</title><desc>Local Mac runtime, camera, Arduino watchdog, motor driver, robot and simulation substitutes. Hardware commissioning remains pending.</desc><defs><marker id="arrow-233540" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#233540" stroke-width="2"/></marker><marker id="arrow-233540-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1 L2 5 L9 9" fill="none" stroke="#233540" stroke-width="2"/></marker><marker id="arrow-596c76" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#596c76" stroke-width="2"/></marker><marker id="arrow-596c76-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1 L2 5 L9 9" fill="none" stroke="#596c76" stroke-width="2"/></marker><marker id="arrow-2b6eab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#2b6eab" stroke-width="2"/></marker><marker id="arrow-2b6eab-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1 L2 5 L9 9" fill="none" stroke="#2b6eab" stroke-width="2"/></marker><marker id="arrow-22775a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#22775a" stroke-width="2"/></marker><marker id="arrow-22775a-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 1 L2 5 L9 9" fill="none" stroke="#22775a" stroke-width="2"/></marker><marker id="arrow-7755a2" markerWidth="10" markerHeight="10"