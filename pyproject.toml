[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "darwin-robot"
version = "0.1.0"
description = "Local camera-observed motor system identification demo"
requires-python = ">=3.11"
dependencies = ["numpy", "PyYAML", "pyserial", "opencv-contrib-python", "fastapi", "uvicorn"]
[project.optional-dependencies]
dev = ["pytest", "httpx"]
oak = ["depthai>=3,<4"]
[project.scripts]
darwin = "darwin.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
darwin = ["web/static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
